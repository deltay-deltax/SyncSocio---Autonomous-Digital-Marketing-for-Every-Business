<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ═══════════════════════════════════════════
       Favicon — full multi-size set (Google-compliant)
  ════════════════════════════════════════════════ -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">

  <!-- ═══════════════════════════════════════════
       Core SEO
  ════════════════════════════════════════════════ -->
  <title>SyncSocio — AI-Powered Social Media Management</title>
  <meta name="application-name" content="SyncSocio">
  <meta name="theme-color" content="#0B0F19">
  <meta name="description" content="AI-powered social media management platform that automates content creation, scheduling, analytics, AI creatives, and social growth for businesses and creators.">
  <meta name="robots" content="index, follow">

  <!-- Canonical — updated dynamically per-route by useCanonical hook -->
  <link rel="canonical" href="https://syncsocio.com/">

  <!-- ═══════════════════════════════════════════
       Open Graph (Facebook / LinkedIn / WhatsApp)
  ════════════════════════════════════════════════ -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="SyncSocio">
  <meta property="og:url" content="https://syncsocio.com/">
  <meta property="og:title" content="SyncSocio — AI-Powered Social Media Management">
  <meta property="og:description" content="AI-powered social media management platform that automates content creation, scheduling, analytics, AI creatives, and social growth for businesses and creators.">
  <meta property="og:image" content="https://syncsocio.com/android-chrome-512x512.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta property="og:image:alt" content="SyncSocio logo — blue ocean wave icon">
  <meta property="og:locale" content="en_US">

  <!-- ═══════════════════════════════════════════
       Twitter / X Card
  ════════════════════════════════════════════════ -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@SyncSocio">
  <meta name="twitter:title" content="SyncSocio — AI-Powered Social Media Management">
  <meta name="twitter:description" content="AI-powered social media management platform that automates content creation, scheduling, analytics, AI creatives, and social growth for businesses and creators.">
  <meta name="twitter:image" content="https://syncsocio.com/android-chrome-512x512.png">
  <meta name="twitter:image:alt" content="SyncSocio logo — blue ocean wave icon">

  <!-- ═══════════════════════════════════════════
       Fonts
  ════════════════════════════════════════════════ -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
